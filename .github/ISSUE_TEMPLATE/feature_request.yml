name: Funktion vorschlagen
description: Idee für eine neue Funktion oder Verbesserung
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Vorschlag
      description: Wie sollte hud sich verhalten?
    validations:
      required: true
  - type: textarea
    id: alternativen
    attributes:
      label: Betrachtete Alternativen
  - type: checkboxes
    id: bezug
    attributes:
      label: Betroffene Bereiche
      options:
        - label: Übersicht
        - label: Workspaces/Git
        - label: Updates
        - label: KI-Dashboard
        - label: Einstellungen/Config
