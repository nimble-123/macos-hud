[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/nimble-123/macos-hud"

[workspace.dependencies]
hud-domain = { path = "crates/hud-domain" }
hud-application = { path = "crates/hud-application" }
hud-infrastructure = { path = "crates/hud-infrastructure" }
hud-tui = { path = "crates/hud-tui" }

anyhow = "1.0.104"
fluent-templates = "0.15.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
insta = "1.49.0"
jiff = "0.2.38"
proptest = "1.12.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
terminal-colorsaurus = "1.0.3"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio-util = "0.7.20"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
# missing_docs is not set here: `lints.workspace = true` allows no per-crate overrides.
# hud-domain and hud-application set #![warn(missing_docs)] in lib.rs instead.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic exceptions, each with a reason
module_name_repetitions = "allow" # GitError inside mod git is intended
missing_errors_doc = "allow"      # error cases are documented on the error enums
# Bans
unwrap_used = "deny"
expect_used = "warn"              # allowed via #[expect(.., reason = "BUG: ..")] for invariants
dbg_macro = "deny"
todo = "warn"
# Selected nursery lints
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
