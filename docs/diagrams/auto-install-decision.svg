        <title id="auto-install-decision-title">Regeln für die Auto-Installation</title>
        <desc id="auto-install-decision-desc">Entscheidungsregel install_decision: Manuelle Updates brauchen eine Bestätigung; automatische Updates nur, wenn die Quelle Automatik unterstützt, das Opt-in aktiv ist und weder ein npm-Major-Sprung noch ein früherer Passwort-Fall vorliegt.</desc>
