      #auto-install-decision-root { font-family: var(--font-sans); color: var(--color-ink); }
      #auto-install-decision-root .diagram-container { width: 100%; overflow-x: auto; }
      #auto-install-decision-root .diagram-container { overflow-x: visible; }</style>
