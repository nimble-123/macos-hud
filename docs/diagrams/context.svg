<title id="context-title">Systemkontext</title>
<desc id="context-desc">Systemkontext von hud: Nutzer:in bedient hud im Terminal; hud führt Git und die Update-Quellen brew, npm und npx skills aus, liest Claude-Code- und optional Codex-Logs sowie macOS-Systemwerte, empfängt OTLP-Metriken von Claude Code auf 127.0.0.1:4318 und ergänzt nach Bestätigung den env-Block in ~/.claude/settings.json.</desc>
