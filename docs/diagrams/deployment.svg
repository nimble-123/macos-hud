<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc" id="deployment-root">
        <title id="deployment-title">Verteilung auf dem Mac</title>
        <desc id="deployment-desc">Verteilungssicht: hud läuft als lokaler Prozess im Benutzerkonto, nutzt Config, SQLite-Datenbank und Logs, liest KI-Logs und startet git, brew und npm aus dem Login-PATH; nur diese Werkzeuge erreichen Git-Remotes und Paket-Registries im Netz.</desc>
