<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 756" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-model-title domain-model-desc" id="domain-model-root">
        <title id="domain-model-title">Domänenmodell: Git und Updates</title>
        <desc id="domain-model-desc">Kerntypen von hud-domain für Git und Updates: sync_decision liest RepoStatus und liefert SyncDecision mit FastForwardPermit oder SkipReason; install_decision prüft ein UpdateCandidate und liefert InstallDecision mit InstallPermit oder DenyReason. Permits haben private Felder und entstehen nur in diesen Funktionen.</desc>
