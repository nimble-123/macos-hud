        <title id="domain-model-title">Domain-Modell</title>
        <desc id="domain-model-desc">Kerntypen der hud-Domain: SyncDecision wird aus RepoStatus abgeleitet und enthält entweder einen FastForwardPermit oder einen SkipReason; InstallDecision prüft UpdateCandidate; Measured kennzeichnet Werte mit Genauigkeit.</desc>
