      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'Chakra Petch', system-ui, sans-serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #domain-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #domain-model-root .diagram-container { width: 100%; overflow-x: auto; }
      #domain-model-root .diagram-container { overflow-x: visible; }</style>
