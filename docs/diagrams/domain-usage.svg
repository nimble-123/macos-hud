<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-usage-title domain-usage-desc" id="domain-usage-root">
        <title id="domain-usage-title">Domänenmodell: KI-Nutzung</title>
        <desc id="domain-usage-desc">KI-Typen von hud-domain: Ein UsageRecord je Antwort besitzt eine TokenUsage; die PriceTable bepreist Records und ergibt eine CostEstimate; PlanUsage hält die Abo-Auslastung von Codex, TelemetryTotals die Telemetrie von Claude Code und ActivityCalendar die Ereignisse je Tag.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #domain-usage-root { --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #domain-usage-root { font-family: var(--font-sans); color: var(--color-ink); }
      #domain-usage-root .diagram-container { width: 100%; overflow-x: auto; }
      #domain-usage-root .diagram-container { overflow-x: visible; }</style>
