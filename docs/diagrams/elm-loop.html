<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ereignisschleife (Elm-Architektur)</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f2f3f1; --ink: #1c2128; --muted: #47505c; --soft: #5a6470;
      --accent: #b02a8a; --accent-tint: rgba(176,42,138,0.08); --link: #13738a;
      --sans: 'Chakra Petch', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'IBM Plex Serif', serif;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    .frame { width: 100%; max-width: 1200px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 600 clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem)/1.15 var(--sans); letter-spacing: -0.01em; }
    svg { width: 100%; min-width: 960px; display: block; }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .sublabel { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .eyebrow-svg { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.06em; }
    .callout { fill: var(--ink); font: italic 400 14px var(--serif); }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · Laufzeitsicht 6.4</p>
    <h1>Ereignisschleife (Elm-Architektur)</h1>
    <div class="diagram-container">

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13738a"/></marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6470"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#47505c" stroke-width="1.2"/></marker>
        </defs>

        <rect x="480" y="68" width="160" height="64" rx="6" fill="#f2f3f1" stroke="#1c2128" stroke-width="1"/>
        <text x="560" y="96" class="node-name">Msg</text>

        <rect x="708" y="232" width="160" height="64" rx="6" fill="rgba(176,42,138,0.08)" stroke="#b02a8a" stroke-width="1.2"/>
        <text x="788" y="260" class="node-name" style="fill:#b02a8a">update(model, msg)</text>

        <text x="176" y="106" class="sublabel">crossterm EventStream</text>
        <rect x="480" y="396.0" width="160" height="48" rx="6" fill="#f2f3f1"/>

        <text x="560" y="314" fill="#f2f3f1" font-size="16" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">Model</text>
        <text x="560" y="332" fill="#f2f3f1" opacity="0.72" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">reiner UI-Zustand</text>
        <line x1="40" y1="660" x2="920" y2="660" stroke="rgba(28,33,40,0.10)" stroke-width="0.8"/>
        <text x="40" y="680" class="eyebrow-svg">LEGENDE</text>
        <line x1="136" y1="677" x2="164" y2="677" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="172" y="680" class="legend">Ablauf</text>

        <rect x="562" y="671" width="28" height="12" rx="2" fill="rgba(71,80,92,0.15)" stroke="#47505c" stroke-width="1"/>
        <text x="598" y="680" class="legend">Außenwelt</text>

      </svg>
    </div>
  </div>
</body>
</html>
