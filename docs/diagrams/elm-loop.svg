<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="elm-loop-title elm-loop-desc" id="elm-loop-root">
        <title id="elm-loop-title">Ereignisschleife (Elm-Architektur)</title>
        <desc id="elm-loop-desc">Ereignisschleife der TUI nach Elm-Architektur: Msg geht an die reine Funktion update, die das Model schreibt und Commands erzeugt; der Job-Runner erledigt I/O und meldet AppEvents zurück, view rendert den Frame aus dem Model.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #elm-loop-root { --paper: #f2f3f1; --ink: #1c2128; --muted: #47505c; --soft: #5a6470;
      --accent: #b02a8a; --accent-tint: rgba(176,42,138,0.08); --link: #13738a;
      --sans: 'Chakra Petch', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'IBM Plex Serif', serif; }
      #elm-loop-root { color: var(--ink); font-family: var(--sans); }
      #elm-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #elm-loop-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #elm-loop-root .sublabel { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
      #elm-loop-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
      #elm-loop-root .eyebrow-svg { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
      #elm-loop-root .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.06em; }
      #elm-loop-root .callout { fill: var(--ink); font: italic 400 14px var(--serif); }
      #elm-loop-root .diagram-container { overflow-x: visible; }</style>
          <marker id="elm-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47505c"/></marker>
          <marker id="elm-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b02a8a"/></marker>
          <marker id="elm-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13738a"/></marker>
          <marker id="elm-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6470"/></marker>
          <marker id="elm-loop-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#47505c" stroke-width="1.2"/></marker>
        </defs>
