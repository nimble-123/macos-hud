<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lebenszyklus eines Installations-Jobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'Chakra Petch', system-ui, sans-serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Laufzeitsicht · State Machine</p>
    <h1>Lebenszyklus eines Installations-Jobs</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 920 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-lifecycle-title job-lifecycle-desc">
        <title id="job-lifecycle-title">Lebenszyklus eines Installations-Jobs</title>
        <desc id="job-lifecycle-desc">Zustände einer Installation: manuell abgelehnte Anfragen enden als Denied, mit Permit wartet der Job als Queued auf die Sperre seiner Quelle, läuft als Running und endet als Succeeded, NeedsInteraction, Failed, TimedOut oder Cancelled; beim Beenden werden wartende Jobs abgebrochen.</desc>

        <rect width="100%" height="100%" fill="#f2f3f1"/>
        <path d="M60 198 V88 Q60 80 68 80 H118" fill="none" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="64.0" y="133" width="55.7" height="12" rx="2" fill="#f2f3f1"/><text x="91.8" y="142" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ABGELEHNT</text>
        <line x1="66" y1="204" x2="118" y2="204" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="72.1" y="183" width="39.8" height="12" rx="2" fill="#f2f3f1"/><text x="92.0" y="192" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PERMIT</text>
        <line x1="280" y1="204" x2="358" y2="204" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="285.9" y="185" width="66.3" height="12" rx="2" fill="#f2f3f1"/><text x="319.0" y="194" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPERRE FREI</text>
        <line x1="520" y1="204" x2="618" y2="204" stroke="#b02a8a" stroke-width="1" marker-end="url(#arrow-accent)"/>
        <rect x="549.1" y="185" width="39.8" height="12" rx="2" fill="#f2f3f1"/><text x="569.0" y="194" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ERFOLG</text>
        <line x1="176" y1="232" x2="176" y2="358" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="184.0" y="289" width="34.5" height="12" rx="2" fill="#f2f3f1"/><text x="201.2" y="298" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DRAIN</text>
        <path d="M400 232 V292 Q400 300 392 300 H260 Q252 300 252 308 V358" fill="none" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="303.4" y="281" width="45.1" height="12" rx="2" fill="#f2f3f1"/><text x="326.0" y="290" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ABBRUCH</text>
        <line x1="440" y1="232" x2="440" y2="358" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="448.0" y="323" width="50.4" height="12" rx="2" fill="#f2f3f1"/><text x="473.2" y="332" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASSWORT</text>
        <path d="M480 232 V308 Q480 316 488 316 H612 Q620 316 620 324 V358" fill="none" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="536.1" y="297" width="39.8" height="12" rx="2" fill="#f2f3f1"/><text x="556.0" y="306" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FEHLER</text>

        <rect x="120" y="56" width="160" height="48" rx="8" fill="#f2f3f1"/>
<rect x="120" y="56" width="160" height="48" rx="8" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="200.0" y="77.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">Denied</text>
<text x="200.0" y="92.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Regel verbietet (manuell)</text>

<rect x="120" y="176" width="160" height="56" rx="8" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="200.0" y="201.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">Queued</text>
<text x="200.0" y="216.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">wartet auf Quellen-Sperre</text>
        <rect x="360" y="176" width="160" height="56" rx="8" fill="#f2f3f1"/>
<rect x="360" y="176" width="160" height="56" rx="8" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="440.0" y="201.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">Running</text>
<text x="440.0" y="216.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Werkzeug läuft</text>
        <rect x="620" y="176" width="160" height="56" rx="8" fill="#f2f3f1"/>
<rect x="620" y="176" width="160" height="56" rx="8" fill="rgba(176,42,138,0.08)" stroke="#b02a8a" stroke-width="1"/>
<text x="700.0" y="201.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">Succeeded</text>
<text x="700.0" y="216.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">installiert</text>
        <text x="40" y="344" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">ENDZUSTÄNDE</text>
        <rect x="110" y="360" width="160" height="56" rx="8" fill="#f2f3f1"/>
<rect x="110" y="360" width="160" height="56" rx="8" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="190.0" y="385.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">Cancelled</text>
<text x="190.0" y="400.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">hud beendet</text>
        <rect x="365" y="360" width="150" height="56" rx="8" fill="#f2f3f1"/>
<rect x="365" y="360" width="150" height="56" rx="8" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="440.0" y="385.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">NeedsInteraction</text>
<text x="440.0" y="400.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Passwort nötig</text>
        <rect x="545" y="360" width="150" height="56" rx="8" fill="#f2f3f1"/>
<rect x="545" y="360" width="150" height="56" rx="8" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="620.0" y="385.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">Failed</text>
<text x="620.0" y="400.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">letzte Fehlerzeile</text>
        <rect x="725" y="360" width="150" height="56" rx="8" fill="#f2f3f1"/>
<rect x="725" y="360" width="150" height="56" rx="8" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="800.0" y="385.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">TimedOut</text>
<text x="800.0" y="400.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Werkzeug gestoppt</text>
        <text x="312" y="76" fill="#1c2128" font-size="14" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Auslöser: Install-Befehl (u, Enter) oder</text>
<text x="312" y="94" fill="#1c2128" font-size="14" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Auto-Installation nach jeder Prüfung</text>
        <text x="40" y="456" fill="#1c2128" font-size="14" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Nur Installationen sind Jobs. Automatisch abgelehnte erzeugen keinen;</text>
<text x="40" y="474" fill="#1c2128" font-size="14" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">die Sperre gilt je Quelle (Homebrew, npm, Skills), nicht je Paket.</text>

<text x="40" y="528" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGENDE</text>

<text x="314.4" y="531" fill="#47505c" font-size="9" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">Erfolg</text>
<line x1="362.59999999999997" y1="527" x2="390.59999999999997" y2="527" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
<text x="398.59999999999997" y="531" fill="#47505c" font-size="9" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">Übergang</text>
      </svg>
    </div>
  </div>
</body>
</html>
