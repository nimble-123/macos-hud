<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-lifecycle-title job-lifecycle-desc" id="job-lifecycle-root">
        <title id="job-lifecycle-title">Lebenszyklus eines Jobs</title>
        <desc id="job-lifecycle-desc">Ein Job wird geplant, wartet auf die Sperre seiner Ressource, läuft und endet erfolgreich, fehlgeschlagen oder abgebrochen; Taste q öffnet den Beenden-Dialog, der standardmäßig wartet oder per Abbruch die Kindprozesse beendet.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #job-lifecycle-root { --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #job-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #job-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      #job-lifecycle-root .diagram-container { overflow-x: visible; }</style>
