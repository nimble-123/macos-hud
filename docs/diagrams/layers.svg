        <title id="layers-title">Crate-Schichten</title>
        <desc id="layers-desc">Abhängigkeitsgraph der fünf Crates: hud hängt von hud-tui, hud-infrastructure und hud-application ab, beide Außenschichten hängen von hud-application und hud-domain ab, alle Abhängigkeiten zeigen nach innen und hud-tui darf hud-infrastructure nicht kennen.</desc>
