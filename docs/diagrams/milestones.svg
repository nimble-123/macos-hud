<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="milestones-title milestones-desc" id="milestones-root">
        <title id="milestones-title">Meilensteine M0 bis M6</title>
        <desc id="milestones-desc">Sieben aufeinanderfolgende Meilensteine von M0 Repo und Skelett bis M6 Feinschliff mit zusammen rund 28 Stunden; M1 Workspaces und Git ist hervorgehoben, weil dort das Permit-Konzept entsteht.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #milestones-root { --paper: #f2f3f1; --ink: #1c2128; --muted: #47505c; --soft: #5a6470;
      --accent: #b02a8a; --accent-tint: rgba(176,42,138,0.08); --link: #13738a;
      --sans: 'Chakra Petch', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'IBM Plex Serif', serif; }
      #milestones-root { color: var(--ink); font-family: var(--sans); }
      #milestones-root .diagram-container { width: 100%; overflow-x: auto; }
      #milestones-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #milestones-root .sublabel { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
      #milestones-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
      #milestones-root .eyebrow-svg { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
      #milestones-root .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.06em; }
      #milestones-root .callout { fill: var(--ink); font: italic 400 14px var(--serif); }
      #milestones-root .diagram-container { overflow-x: visible; }</style>
          <marker id="milestones-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47505c"/></marker>
          <marker id="milestones-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b02a8a"/></marker>
          <marker id="milestones-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13738a"/></marker>
          <marker id="milestones-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6470"/></marker>
          <marker id="milestones-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#47505c" stroke-width="1.2"/></marker>
