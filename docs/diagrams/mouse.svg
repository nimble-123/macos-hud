<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mouse-title mouse-desc" id="mouse-root">
        <title id="mouse-title">Mausbedienung</title>
        <desc id="mouse-desc">Ein Mausereignis wird wie eine Taste behandelt: das Rad bewegt die Auswahl, ein Klick schließt die Hilfe, wird bei offenen Dialogen ignoriert und sonst über view::hit mit derselben Layout-Rechnung wie beim Zeichnen einem Tab, einer Taste, einem Zeitraum oder einer Zeile zugeordnet.</desc>
