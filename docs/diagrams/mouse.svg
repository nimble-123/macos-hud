      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'Chakra Petch', system-ui, sans-serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #mouse-root { font-family: var(--font-sans); color: var(--color-ink); }
      #mouse-root .diagram-container { width: 100%; overflow-x: auto; }
      #mouse-root .diagram-container { overflow-x: visible; }</style>
