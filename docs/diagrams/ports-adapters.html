<desc id="ports-adapters-desc">Ports und Adapter: hud-tui schickt Commands an die Agents in hud-application und erhält AppEvents zurück; der OtlpReceiver speist Telemetrie über einen Kanal ein; die Agents nutzen die Regeln aus hud-domain und rufen Ports, die die Adapter in hud-infrastructure implementieren: Git, Update-Quellen, KI-Logs, Claude-Einstellungen, SQLite und Config sowie System.</desc>
