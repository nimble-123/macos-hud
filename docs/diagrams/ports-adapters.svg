        <title id="ports-adapters-title">Ports und Adapter</title>
        <desc id="ports-adapters-desc">Ports-und-Adapter-Sicht: hud-tui schickt Commands an die Use Cases in hud-application und erhält AppEvents zurück; die Use Cases nutzen die Regeln aus hud-domain und sprechen über Ports, die Adapter in hud-infrastructure für Git, Update-Quellen, KI-Logs, Persistenz und System implementieren.</desc>
