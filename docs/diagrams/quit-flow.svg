<rect x="650" y="216" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="740.0" y="241.5" fill="#1c2128" font-size="12" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle" font-weight="600">Terminal zurück</text>
<text x="740.0" y="256.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Raw Mode, Alt-Screen, Maus</text>
