<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quit-flow-title quit-flow-desc" id="quit-flow-root">
        <title id="quit-flow-title">Beenden und Abbau</title>
        <desc id="quit-flow-desc">Beenden von hud: ohne laufende Installation endet die Schleife sofort, sonst fragt ein Dialog (Enter wartet, a bricht ab, Esc kehrt zurück); danach wird zuerst das Terminal wiederhergestellt, dann das Abbruch-Token ausgelöst (SIGTERM, nach 5 s SIGKILL) und höchstens 8 s auf die Agents gewartet.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #quit-flow-root { --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'Chakra Petch', system-ui, sans-serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #quit-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #quit-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #quit-flow-root .diagram-container { overflow-x: visible; }</style><marker id="quit-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47505c"/></marker><marker id="quit-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b02a8a"/></marker><marker id="quit-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13738a"/></marker><marker id="quit-flow-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#47505c" stroke-width="1.2"/></marker></defs>
