<text x="740.0" y="352.5" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">SIGTERM, nach 5 s SIGKILL</text>
        <rect x="650" y="408" width="180" height="56" rx="6" fill="#f2f3f1"/>
<rect x="650" y="408" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
