<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="release-title release-desc" id="release-root">
<title id="release-title">Release-Pipeline</title>
<desc id="release-desc">Release-Pipeline: release-please erzeugt Release-PR und GitHub-Release; Release-Build baut auf macOS ein Universal-Binary (aarch64 und x86_64 per lipo) und prüft --version; Publish hängt Archiv, Prüfsumme und Build-Attestation an das Release; der Tap-Job schreibt Formula/hud.rb in nimble-123/homebrew-tap, von wo brew installiert. Release-PRs werden nur gebaut.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #release-root { --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-title:    'Chakra Petch', system-ui, sans-serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #release-root { font-family: var(--font-sans); color: var(--color-ink); }
      #release-root .diagram-container { width: 100%; overflow-x: auto; }
      #release-root .diagram-container { overflow-x: visible; }</style>
