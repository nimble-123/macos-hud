<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-auto-ff-title seq-auto-ff-desc" id="seq-auto-ff-root">
        <title id="seq-auto-ff-title">Automatischer Fast-Forward</title>
        <desc id="seq-auto-ff-desc">Sequenz des automatischen Fast-Forward: Der Use Case holt Status per Git, die Domain erteilt einen Permit, der Adapter führt den Fast-Forward nur bei unverändertem HEAD aus, beide Schritte werden protokolliert und die TUI informiert.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #seq-auto-ff-root { --paper: #f2f3f1; --ink: #1c2128; --muted: #47505c; --soft: #5a6470;
      --accent: #b02a8a; --accent-tint: rgba(176,42,138,0.08); --link: #13738a;
      --sans: 'Chakra Petch', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'IBM Plex Serif', serif; }
      #seq-auto-ff-root { color: var(--ink); font-family: var(--sans); }
      #seq-auto-ff-root .diagram-container { width: 100%; overflow-x: auto; }
      #seq-auto-ff-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #seq-auto-ff-root .sublabel { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
      #seq-auto-ff-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
      #seq-auto-ff-root .eyebrow-svg { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
      #seq-auto-ff-root .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.06em; }
      #seq-auto-ff-root .callout { fill: var(--ink); font: italic 400 14px var(--serif); }
      #seq-auto-ff-root .diagram-container { overflow-x: visible; }</style>
