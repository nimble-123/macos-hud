<svg viewBox="0 0 760 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="startup-flow-title startup-flow-desc" id="startup-flow-root">
        <title id="startup-flow-title">Start und Erststart</title>
        <desc id="startup-flow-desc">Ablauf beim Start von hud: Kommandozeile (Ausgabe oder Reset enden ohne TUI), Logging und Config (ungültig beendet hud), Umgebung und Terminal, bei fehlendem Workspace der Einrichtungsdialog (Esc beendet ohne zu schreiben), dann die Composition Root mit OTLP-Empfänger, SQLite und Agents und die Ereignisschleife.</desc>
