<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="startup-flow-title startup-flow-desc" id="startup-flow-root">
        <title id="startup-flow-title">Start und Erststart</title>
        <desc id="startup-flow-desc">Ablauf beim Start von hud: Terminal-Guard und Logging, Config lesen, bei fehlendem Workspace der Einrichtungsdialog, dann SQLite, Umgebungserkennung und die Composition Root, die Scheduler und Job-Runner startet.</desc>
