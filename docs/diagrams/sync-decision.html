<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regeln für den Fast-Forward</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Chakra Petch', system-ui, sans-serif;
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · hud</p>
    <h1>Regeln für den Fast-Forward</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-decision-title sync-decision-desc">
        <title id="sync-decision-title">Regeln für den Fast-Forward</title>
        <desc id="sync-decision-desc">Entscheidungsregel sync_decision in fester Reihenfolge: laufende Git-Operation, detached HEAD, keine Commits, kein Upstream und lokale Änderungen überspringen das Repo; danach entscheiden Ahead/Behind, und im Auto-Modus greift das Workspace-Opt-out; nur ein sauberes Repo, das ausschließlich hinter dem Upstream liegt, erhält einen Permit.</desc>

        </defs>
        <rect width="100%" height="100%" fill="#f2f3f1"/>
        <line x1="420" y1="76" x2="420" y2="96" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="540" y1="150" x2="698" y2="150" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="606" y="130" width="28" height="12" rx="2" fill="#f2f3f1"/><text x="620" y="139" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEIN</text>
        <line x1="420" y1="202" x2="420" y2="250" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="428" y="221" width="20" height="12" rx="2" fill="#f2f3f1"/><text x="438" y="230" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JA</text>
        <line x1="540" y1="304" x2="698" y2="304" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="592" y="284" width="56" height="12" rx="2" fill="#f2f3f1"/><text x="620" y="293" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AHEAD &gt; 0</text>
        <line x1="300" y1="304" x2="222" y2="304" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="244" y="284" width="32" height="12" rx="2" fill="#f2f3f1"/><text x="260" y="293" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">0 / 0</text>
        <line x1="420" y1="356" x2="420" y2="402" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="428" y="374" width="60" height="12" rx="2" fill="#f2f3f1"/><text x="458" y="383" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NUR BEHIND</text>
        <line x1="540" y1="456" x2="698" y2="456" stroke="#47505c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="610" y="436" width="20" height="12" rx="2" fill="#f2f3f1"/><text x="620" y="445" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JA</text>
        <line x1="420" y1="508" x2="420" y2="546" stroke="#b02a8a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="428" y="522" width="28" height="12" rx="2" fill="#f2f3f1"/><text x="442" y="531" fill="#b02a8a" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEIN</text>
        <rect x="340" y="32" width="160" height="44" rx="20" fill="#f2f3f1"/>
<rect x="340" y="32" width="160" height="44" rx="20" fill="rgba(28,33,40,0.03)" stroke="rgba(28,33,40,0.30)" stroke-width="1"/>
<text x="420" y="51" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">Repo-Status</text>
<text x="420" y="67" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">status + upstream-oid</text>
        <polygon points="420,98 540,150 420,202 300,150" fill="#f2f3f1"/>
<polygon points="420,98 540,150 420,202 300,150" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="420" y="147" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">Sauber und</text>
<text x="420" y="161" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">prüfbar?</text>

<rect x="700" y="104" width="260" height="92" rx="20" fill="#ffffff" stroke="#8f6200" stroke-width="1"/>
<text x="830" y="133" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle"><tspan fill="#8f6200">▲</tspan> Übersprungen</text>
<text x="830" y="149" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Git-Operation läuft · detached HEAD</text>
<text x="830" y="161" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">keine Commits · kein Upstream</text>
<text x="830" y="173" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">lokale Änderungen</text>
        <polygon points="420,252 540,304 420,356 300,304" fill="#f2f3f1"/>
<polygon points="420,252 540,304 420,356 300,304" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="420" y="308" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">Ahead / Behind?</text>
        <rect x="700" y="264" width="260" height="80" rx="20" fill="#f2f3f1"/>
        <rect x="700" y="264" width="260" height="80" rx="20" fill="#ffffff" stroke="#47505c" stroke-width="1"/>
        <text x="830" y="296" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">Nicht vorziehbar</text>
        <text x="830" y="312" fill="#8f6200" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">▲ voraus · nur ahead</text>
        <text x="830" y="324" fill="#b42f25" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">✖ divergiert · ahead + behind</text>
        <rect x="60" y="280" width="160" height="48" rx="20" fill="#f2f3f1"/>
<rect x="60" y="280" width="160" height="48" rx="20" fill="#ffffff" stroke="#47505c" stroke-width="1"/>
<text x="140" y="301" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle"><tspan fill="#47505c">○</tspan> Aktuell</text>
<text x="140" y="317" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">nichts zu tun</text>
        <polygon points="420,404 540,456 420,508 300,456" fill="#f2f3f1"/>
<polygon points="420,404 540,456 420,508 300,456" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
<text x="420" y="453" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">Auto-Modus und</text>
<text x="420" y="467" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle">Workspace-Opt-out?</text>
        <rect x="700" y="420" width="260" height="72" rx="20" fill="#f2f3f1"/>
<rect x="700" y="420" width="260" height="72" rx="20" fill="#ffffff" stroke="#8f6200" stroke-width="1"/>
<text x="830" y="453" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle"><tspan fill="#8f6200">▲</tspan> Übersprungen: Opt-out</text>
<text x="830" y="469" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">manuell per Taste f möglich</text>
        <rect x="320" y="548" width="200" height="64" rx="20" fill="#f2f3f1"/>
<rect x="320" y="548" width="200" height="64" rx="20" fill="rgba(176,42,138,0.08)" stroke="#b02a8a" stroke-width="1"/>
<text x="420" y="577" fill="#1c2128" font-size="12" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="middle"><tspan fill="#24774a">●</tspan> Fast-Forward</text>
<text x="420" y="593" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Permit(head, target, commits)</text>
        <text x="40" y="136" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Untracked Dateien blockieren nicht:</text>
<text x="40" y="153" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Git bricht selbst ab, falls der</text>
<text x="40" y="170" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Upstream eine gleichnamige</text>
<text x="40" y="187" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Datei mitbringt.</text>
        <text x="40" y="420" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Die Regeln laufen in fester</text>
<text x="40" y="437" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Reihenfolge; ein Repo meldet</text>
<text x="40" y="454" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">immer den ersten Grund.</text>
        <line x1="40" y1="636" x2="960" y2="636" stroke="rgba(28,33,40,0.10)" stroke-width="0.8"/><text x="40" y="652" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGENDE</text>
        <polygon points="132,642 144,648 132,654 120,648" fill="#ffffff" stroke="#1c2128" stroke-width="1"/>
        <text x="152" y="652" fill="#47505c" font-size="9" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">Prüfung</text>
        <line x1="230" y1="648" x2="256" y2="648" stroke="#b02a8a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="264" y="652" fill="#47505c" font-size="9" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">Erfolgspfad</text>
        <text x="350" y="653" fill="#24774a" font-size="11" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">●</text>
        <text x="364" y="652" fill="#47505c" font-size="9" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">erledigt</text>
        <text x="442" y="653" fill="#8f6200" font-size="11" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">▲</text>
        <text x="456" y="652" fill="#47505c" font-size="9" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">Achtung</text>

        <text x="640" y="652" fill="#47505c" font-size="9" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">neutral</text>
      </svg>
    </div>
  </div>
</body>
</html>
