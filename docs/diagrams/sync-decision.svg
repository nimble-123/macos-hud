        <rect x="592" y="284" width="56" height="12" rx="2" fill="#f2f3f1"/><text x="620" y="293" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AHEAD &gt; 0</text>
        <line x1="300" y1="304" x2="222" y2="304" stroke="#47505c" stroke-width="1.2" marker-end="url(#sync-decision-arrow)"/>
