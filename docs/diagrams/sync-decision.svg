<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-decision-title sync-decision-desc" id="sync-decision-root">
        <title id="sync-decision-title">Regeln für den Fast-Forward</title>
        <desc id="sync-decision-desc">Entscheidungsregel sync_decision: Ein Repo wird nur vorgezogen, wenn es sauber und prüfbar ist, ausschließlich hinter dem Upstream liegt und kein Workspace-Opt-out im Auto-Modus greift; sonst wird es mit Grund übersprungen.</desc>
