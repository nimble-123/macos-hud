        <line x1="540" y1="456" x2="698" y2="456" stroke="#47505c" stroke-width="1.2" marker-end="url(#sync-decision-arrow)"/>
        <rect x="610" y="436" width="20" height="12" rx="2" fill="#f2f3f1"/><text x="620" y="445" fill="#5a6470" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JA</text>
