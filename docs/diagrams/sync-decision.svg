<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-decision-title sync-decision-desc" id="sync-decision-root">
        <title id="sync-decision-title">Regeln für den Fast-Forward</title>
        <desc id="sync-decision-desc">Entscheidungsregel sync_decision in fester Reihenfolge: laufende Git-Operation, detached HEAD, keine Commits, kein Upstream und lokale Änderungen überspringen das Repo; danach entscheiden Ahead/Behind, und im Auto-Modus greift das Workspace-Opt-out; nur ein sauberes Repo, das ausschließlich hinter dem Upstream liegt, erhält einen Permit.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sync-decision-root { --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #sync-decision-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sync-decision-root .diagram-container { width: 100%; overflow-x: auto; }
      #sync-decision-root .diagram-container { overflow-x: visible; }</style>
          <marker id="sync-decision-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47505c"/></marker>
          <marker id="sync-decision-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b02a8a"/></marker>
        </defs>
