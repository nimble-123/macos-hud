<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="telemetry-flow-title telemetry-flow-desc" id="telemetry-flow-root">
        <title id="telemetry-flow-title">Telemetrie von Claude Code</title>
        <desc id="telemetry-flow-desc">Claude Code sendet OTLP-Metriken an den lokalen Empfänger von hud, der TelemetryAgent speichert sie in otel_metric; die Taste t ergänzt nach Rückfrage nur fehlende env-Einträge in ~/.claude/settings.json und schreibt bei Konflikten nichts.</desc>
