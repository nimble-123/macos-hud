<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testpyramide</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f2f3f1; --ink: #1c2128; --muted: #47505c; --soft: #5a6470;
      --accent: #b02a8a; --accent-tint: rgba(176,42,138,0.08); --link: #13738a;
      --sans: 'Chakra Petch', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'IBM Plex Serif', serif;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    .frame { width: 100%; max-width: 1200px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 600 clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem)/1.15 var(--sans); letter-spacing: -0.01em; }
    svg { width: 100%; min-width: 960px; display: block; }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .sublabel { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .eyebrow-svg { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.06em; }
    .callout { fill: var(--ink); font: italic 400 14px var(--serif); }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramide · Teststrategie</p>
    <h1>Testpyramide</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-pyramid-title test-pyramid-desc">
        <title id="test-pyramid-title">Testpyramide</title>
        <desc id="test-pyramid-desc">Testpyramide von hud: viele schnelle Domain-Regeltests als Basis, darüber Use-Case-Tests gegen Fakes, Infrastruktur-Tests mit Fixtures und temporären Git-Repos und an der Spitze TUI-Snapshot-Tests.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47505c"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b02a8a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13738a"/></marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6470"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#47505c" stroke-width="1.2"/></marker>
        </defs>
        <rect width="960" height="440" fill="#f2f3f1"/>
        <polygon points="80,368 640,368 584,296 136,296" fill="rgba(28,33,40,0.08)" stroke="#47505c" stroke-width="1"/>
        <text x="360" y="336" class="node-name" font-size="13">Domain-Regeln</text>
        <line x1="624" y1="332" x2="660" y2="332" stroke="rgba(28,33,40,0.20)" stroke-width="0.8" stroke-dasharray="2,3"/>
        <text x="672" y="330" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">Unit-Tests + proptest</text>
        <text x="672" y="344" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">viele, Millisekunden</text>
        <polygon points="136,296 584,296 528,224 192,224" fill="rgba(28,33,40,0.06)" stroke="#47505c" stroke-width="1"/>
        <text x="360" y="264" class="node-name" font-size="13">Application</text>
        <line x1="568" y1="260" x2="660" y2="260" stroke="rgba(28,33,40,0.20)" stroke-width="0.8" stroke-dasharray="2,3"/>
        <text x="672" y="258" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">Use Cases gegen Fakes</text>
        <text x="672" y="272" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">mockall nur gezielt</text>
        <polygon points="192,224 528,224 472,152 248,152" fill="rgba(28,33,40,0.04)" stroke="#47505c" stroke-width="1"/>
        <text x="360" y="192" class="node-name" font-size="13">Infrastructure</text>
        <line x1="512" y1="188" x2="660" y2="188" stroke="rgba(28,33,40,0.20)" stroke-width="0.8" stroke-dasharray="2,3"/>
        <text x="672" y="186" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">Fixtures, temporäre Git-Repos</text>
        <text x="672" y="200" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">FakeProcessRunner</text>
        <polygon points="248,152 472,152 416,80 304,80" fill="rgba(28,33,40,0.02)" stroke="#47505c" stroke-width="1"/>
        <text x="360" y="120" class="node-name" font-size="13">TUI</text>
        <line x1="456" y1="116" x2="660" y2="116" stroke="rgba(28,33,40,0.20)" stroke-width="0.8" stroke-dasharray="2,3"/>
        <text x="672" y="114" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">update-Tests + insta</text>
        <text x="672" y="128" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">de/en, hell/dunkel</text>
        <line x1="40" y1="368" x2="40" y2="88" stroke="#47505c" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="28" y="76" class="eyebrow-svg">WENIGER, LANGSAMER</text>
        <text x="28" y="388" class="eyebrow-svg">MEHR, SCHNELLER</text>
        <text x="672" y="232" class="callout">kein Test ruft echtes brew, npm oder npx auf</text>
        <path d="M 668 226 Q 662 210 662 196" fill="none" stroke="rgba(28,33,40,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="662" cy="192" r="2" fill="#1c2128"/>

      </svg>
    </div>
  </div>
</body>
</html>
