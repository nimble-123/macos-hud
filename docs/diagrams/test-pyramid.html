<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests je Schicht</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Chakra Petch', system-ui, sans-serif;
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Balkendiagramm · Teststrategie</p>
    <h1>Tests je Schicht</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-pyramid-title test-pyramid-desc">
        <title id="test-pyramid-title">Tests je Schicht</title>
        <desc id="test-pyramid-desc">Anzahl der Tests je Crate: hud-domain 47 mit 7 proptest-Eigenschaften, hud-application 59 gegen Fakes, hud-infrastructure 117 mit FakeRunner, Fixtures und temporären Git-Repos, hud-tui 149 mit 46 insta-Snapshots, je Ansicht Deutsch und Englisch, das Binary 13 für CLI und Reset.</desc>
        
        <rect width="100%" height="100%" fill="#f2f3f1"/>
        <line x1="360" y1="56" x2="360" y2="408" stroke="rgba(28,33,40,0.08)" stroke-width="0.8"/>
        <line x1="520" y1="56" x2="520" y2="408" stroke="rgba(28,33,40,0.08)" stroke-width="0.8"/>
        <line x1="680" y1="56" x2="680" y2="408" stroke="rgba(28,33,40,0.08)" stroke-width="0.8"/>
        <line x1="200" y1="40" x2="200" y2="420" stroke="rgba(28,33,40,0.25)" stroke-width="1"/>
        <text x="200" y="440" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">0</text>
        <text x="360" y="440" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">50</text>
        <text x="520" y="440" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">100</text>
        <text x="680" y="440" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">150</text>
        <text x="440" y="462" fill="#47505c" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">Tests je Crate (#[test] und #[tokio::test])</text>
        <text x="188" y="100" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="end">hud-domain</text>
        <rect x="200" y="82" width="150.4" height="28" fill="#f2f3f1"/>
        <rect x="200" y="82" width="150.4" height="28" fill="rgba(176,42,138,0.08)" stroke="#b02a8a" stroke-width="1"/>
        <text x="360.4" y="94" fill="#b02a8a" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">47</text>
        <text x="360.4" y="107" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">Unit-Tests, 7 proptest-Eigenschaften der Permit-Regeln</text>
        <text x="188" y="164" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="end">hud-application</text>
        <rect x="200" y="146" width="188.8" height="28" fill="#f2f3f1"/>
        <rect x="200" y="146" width="188.8" height="28" fill="rgba(71,80,92,0.15)" stroke="#47505c" stroke-width="1"/>
        <text x="398.8" y="158" fill="#47505c" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">59</text>
        <text x="398.8" y="171" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">Use Cases und Agents gegen handgeschriebene Fakes</text>
        <text x="188" y="228" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="end">hud-infrastructure</text>
        <rect x="200" y="210" width="374.4" height="28" fill="#f2f3f1"/>
        <rect x="200" y="210" width="374.4" height="28" fill="rgba(71,80,92,0.15)" stroke="#47505c" stroke-width="1"/>
        <text x="584.4" y="222" fill="#47505c" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">117</text>
        <text x="584.4" y="235" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">FakeRunner, Fixtures (auch .jsonl.zst), temporäre Git-Repos</text>
        <text x="188" y="292" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="end">hud-tui</text>
        <rect x="200" y="274" width="476.8" height="28" fill="#f2f3f1"/>
        <rect x="200" y="274" width="476.8" height="28" fill="rgba(71,80,92,0.15)" stroke="#47505c" stroke-width="1"/>
        <text x="686.8" y="286" fill="#47505c" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">149</text>
        <text x="686.8" y="299" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">update- und Maus-Tests, 46 Snapshots de/en</text>
        <text x="188" y="356" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="end">hud</text>
        <rect x="200" y="338" width="41.6" height="28" fill="#f2f3f1"/>
        <rect x="200" y="338" width="41.6" height="28" fill="rgba(71,80,92,0.15)" stroke="#47505c" stroke-width="1"/>
        <text x="251.6" y="350" fill="#47505c" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif" text-anchor="start">13</text>
        <text x="251.6" y="363" fill="#47505c" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start">Binary: CLI und Reset mit tempfile</text>
        <text x="200" y="506" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Kein Test ruft echtes brew upgrade, npm install -g oder npx auf;</text>
<text x="200" y="523" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Prozesse laufen gegen den FakeRunner, Git gegen temporäre Repos.</text>
      </svg>
    </div>
  </div>
</body>
</html>
