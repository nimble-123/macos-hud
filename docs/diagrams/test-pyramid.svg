        <text x="200" y="506" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Kein Test ruft echtes brew upgrade, npm install -g oder npx auf;</text>
<text x="200" y="523" fill="#47505c" font-size="13" font-family="'IBM Plex Serif', serif" text-anchor="start" font-style="italic">Prozesse laufen gegen den FakeRunner, Git gegen temporäre Repos.</text>
