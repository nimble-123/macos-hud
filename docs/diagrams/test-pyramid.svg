<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-pyramid-title test-pyramid-desc" id="test-pyramid-root">
        <title id="test-pyramid-title">Tests je Schicht</title>
        <desc id="test-pyramid-desc">Anzahl der Tests je Crate: hud-domain 47 mit 7 proptest-Eigenschaften, hud-application 60 gegen Fakes, hud-infrastructure 120 mit FakeRunner, Fixtures und temporären Git-Repos, hud-tui 157 mit 72 insta-Snapshots, je Ansicht Deutsch und Englisch, das Binary 13 für CLI und Reset.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #test-pyramid-root { --color-paper:   #f2f3f1;
      --color-ink:     #1c2128;
      --color-muted:   #47505c;
      --color-accent:  #b02a8a;
      --font-sans:     'Chakra Petch', system-ui, sans-serif;
      --font-serif:    'IBM Plex Serif', serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #test-pyramid-root { font-family: var(--font-sans); color: var(--color-ink); }
      #test-pyramid-root .diagram-container { width: 100%; overflow-x: auto; }
      #test-pyramid-root .diagram-container { overflow-x: visible; }</style>
  </defs>
        
