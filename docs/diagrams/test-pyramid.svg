<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-pyramid-title test-pyramid-desc" id="test-pyramid-root">
        <title id="test-pyramid-title">Testpyramide</title>
        <desc id="test-pyramid-desc">Testpyramide von hud: viele schnelle Domain-Regeltests als Basis, darüber Use-Case-Tests gegen Fakes, Infrastruktur-Tests mit Fixtures und temporären Git-Repos und an der Spitze TUI-Snapshot-Tests.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #test-pyramid-root { --paper: #f2f3f1; --ink: #1c2128; --muted: #47505c; --soft: #5a6470;
      --accent: #b02a8a; --accent-tint: rgba(176,42,138,0.08); --link: #13738a;
      --sans: 'Chakra Petch', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'IBM Plex Serif', serif; }
      #test-pyramid-root { color: var(--ink); font-family: var(--sans); }
      #test-pyramid-root .diagram-container { width: 100%; overflow-x: auto; }
      #test-pyramid-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #test-pyramid-root .sublabel { fill: var(--soft); font: 400 9px var(--mono); text-anchor: middle; }
      #test-pyramid-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
      #test-pyramid-root .eyebrow-svg { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
      #test-pyramid-root .legend { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.06em; }
      #test-pyramid-root .callout { fill: var(--ink); font: italic 400 14px var(--serif); }
      #test-pyramid-root .diagram-container { overflow-x: visible; }</style>
          <marker id="test-pyramid-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47505c"/></marker>
          <marker id="test-pyramid-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b02a8a"/></marker>
          <marker id="test-pyramid-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#13738a"/></marker>
          <marker id="test-pyramid-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6470"/></marker>
          <marker id="test-pyramid-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#47505c" stroke-width="1.2"/></marker>
        </defs>
        <rect width="960" height="440" fill="#f2f3f1"/>
        <polygon points="80,368 640,368 584,296 136,296" fill="#1c2128" stroke="#47505c" stroke-width="1" fill-opacity="0.08"/>
        <text x="360" y="336" class="node-name" font-size="13">Domain-Regeln</text>
        <line x1="624" y1="332" x2="660" y2="332" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.20"/>
        <text x="672" y="330" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">Unit-Tests + proptest</text>
        <text x="672" y="344" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">viele, Millisekunden</text>
        <polygon points="136,296 584,296 528,224 192,224" fill="#1c2128" stroke="#47505c" stroke-width="1" fill-opacity="0.06"/>
        <text x="360" y="264" class="node-name" font-size="13">Application</text>
        <line x1="568" y1="260" x2="660" y2="260" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.20"/>
        <text x="672" y="258" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">Use Cases gegen Fakes</text>
        <text x="672" y="272" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">mockall nur gezielt</text>
        <polygon points="192,224 528,224 472,152 248,152" fill="#1c2128" stroke="#47505c" stroke-width="1" fill-opacity="0.04"/>
        <text x="360" y="192" class="node-name" font-size="13">Infrastructure</text>
        <line x1="512" y1="188" x2="660" y2="188" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.20"/>
        <text x="672" y="186" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">Fixtures, temporäre Git-Repos</text>
        <text x="672" y="200" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">FakeProcessRunner</text>
        <polygon points="248,152 472,152 416,80 304,80" fill="#1c2128" stroke="#47505c" stroke-width="1" fill-opacity="0.02"/>
        <text x="360" y="120" class="node-name" font-size="13">TUI</text>
        <line x1="456" y1="116" x2="660" y2="116" stroke="#1c2128" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.20"/>
        <text x="672" y="114" fill="#1c2128" font-size="11" font-weight="600" font-family="'Chakra Petch', system-ui, sans-serif">update-Tests + insta</text>
        <text x="672" y="128" fill="#5a6470" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace">de/en, hell/dunkel</text>
        <line x1="40" y1="368" x2="40" y2="88" stroke="#47505c" stroke-width="1" marker-end="url(#test-pyramid-arrow)"/>
        <text x="28" y="76" class="eyebrow-svg">WENIGER, LANGSAMER</text>
        <text x="28" y="388" class="eyebrow-svg">MEHR, SCHNELLER</text>
        <text x="672" y="232" class="callout">kein Test ruft echtes brew, npm oder npx auf</text>
        <path d="M 668 226 Q 662 210 662 196" fill="none" stroke="#1c2128" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="662" cy="192" r="2" fill="#1c2128"/>

      </svg>
